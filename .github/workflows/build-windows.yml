name: Windows Build

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ── Python backend binary ──────────────────────────────────────────────

      - uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync --all-packages --extra google-drive

      - name: Build backend binary
        shell: bash
        run: |
          mkdir -p apps/mnemo/gui/src-tauri/binaries
          echo "from mnemo.api import serve; serve()" > _backend_entry.py
          uv run --package mnemo pyinstaller --onefile --name backend \
            --collect-all mnemo --collect-all codex_core \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            _backend_entry.py
          mv dist/backend.exe apps/mnemo/gui/src-tauri/binaries/backend-x86_64-pc-windows-msvc.exe

      # ── Frontend ───────────────────────────────────────────────────────────

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        run: pnpm install

      # ── Tauri (Rust + GUI bundle) ──────────────────────────────────────────

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mnemo/gui/src-tauri -> target

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/mnemo/gui
          tauriScript: pnpm run tauri

      # ── Artifacts ─────────────────────────────────────────────────────────

      - uses: actions/upload-artifact@v4
        with:
          name: mnemo-windows-${{ github.ref_name }}
          path: |
            apps/mnemo/gui/src-tauri/target/release/bundle/msi/*.msi
            apps/mnemo/gui/src-tauri/target/release/bundle/nsis/*.exe
