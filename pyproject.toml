[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "note_taker"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "tqdm>=4.0",
]

[project.scripts]
note     = "note_taker.cli:cli"
note-tui = "note_taker.tui:launch"

[tool.hatch.build.targets.wheel]
packages = ["src/note_taker"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=note_taker --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
files = ["src"]
