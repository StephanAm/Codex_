[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "note_taker"
version = "0.1.1"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "fastapi>=0.110",
    "tqdm>=4.0",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
google-drive = [
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.1",
    "google-auth-oauthlib>=1.0",
]

[project.scripts]
note     = "note_taker.cli:cli"
note-tui = "note_taker.tui:launch"
note-api = "note_taker.api:serve"

[tool.hatch.build.targets.wheel]
packages = ["src/note_taker"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=note_taker --cov-report=term-missing"
markers = ["integration: requires external services (deselected by default)"]

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["google.*", "google_auth_oauthlib.*", "googleapiclient.*"]
ignore_missing_imports = true
