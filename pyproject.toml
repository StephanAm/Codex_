[tool.uv.workspace]
members = ["packages/core", "apps/mnemo"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "apps/mnemo/tests"]
addopts = "--cov=codex_core --cov=mnemo --cov-report=term-missing"
markers = ["integration: requires external services (deselected by default)"]

[tool.coverage.run]
source = ["packages/core/src", "apps/mnemo/src"]

[tool.ruff]
line-length = 120
src = ["packages/core/src", "apps/mnemo/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
files = ["packages/core/src", "apps/mnemo/src"]

[[tool.mypy.overrides]]
module = ["google.*", "google_auth_oauthlib.*", "googleapiclient.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["codex_core.sync.google_drive"]
disallow_untyped_calls = false
