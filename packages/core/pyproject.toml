[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-core"
version = "1.2.7"
description = "Shared data layer for codex applications (models, store, parser, sync)."
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.1",
    "google-auth-oauthlib>=1.0",
    "platformdirs>=4.0",
    "pyyaml>=6.0",
    "truststore>=0.9",
    "tqdm>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_core"]
