[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemo"
version = "1.5.0"
description = "Mnemo — capture, tag, and search plain-text notes. CLI, TUI, and Tauri GUI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "codex-core",
    "click>=8.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
google-drive = [
    "codex-core[google-drive]",
]

[project.scripts]
note          = "mnemo.cli:cli"
note-tui      = "mnemo.tui:launch"
note-api      = "mnemo.api:serve"
note-openapi  = "mnemo.api:export_openapi"
gui           = "mnemo.gui_cli:main"

[tool.uv.sources]
codex-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mnemo"]
