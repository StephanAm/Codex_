[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scribe"
version = "1.2.11"
description = "Scribe — context-aware LLM integration for the Codex workspace."
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "codex-core",
    "ollama>=0.3",
    "python-frontmatter>=1.0",
]

[project.scripts]
scribe = "scribe.cli:main"

[tool.uv.sources]
codex-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/scribe"]
