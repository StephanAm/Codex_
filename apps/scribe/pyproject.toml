[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scribe"
version = "1.2.8rc1"
description = "Scribe — context-aware LLM integration for the Codex workspace."
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "ollama>=0.3",
]

[project.scripts]
scribe = "scribe.cli:main"

[tool.uv.sources]

[tool.hatch.build.targets.wheel]
packages = ["src/scribe"]
